name: CI

# backend/ and frontendnext/ are separate repositories (calling-BE, calling-FENEXT)
# with their own CI; this repository tests the voice server only.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  voice-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Offline suite (all providers stubbed — no API keys needed)
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
